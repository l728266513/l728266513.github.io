# 网站信息
title: Ember
subtitle: ""
description: Ember 的日记与随想。
author: Ember
language: zh-CN
timezone: Asia/Shanghai
url: https://l728266513.github.io
root: /

# 文章与页面
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
permalink: :year/:month/:day/:title/
pretty_urls:
  trailing_index: false
  trailing_html: true
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
updated_option: date

# 每页 6 篇；归档展示全部文章
per_page: 6
pagination_dir: page
index_generator:
  path: ''
  per_page: 6
  order_by: -date
archive_generator:
  per_page: 0
  yearly: true
  monthly: true
tag_generator:
  per_page: 0

# 保留日记和诗歌中的手动换行
marked:
  gfm: true
  breaks: true
highlight:
  enable: true
  line_number: false
  auto_detect: false
prismjs:
  enable: false
theme: ember

# 阅读密码只保存在本机 .private/reading-password.txt，公开源码仅保存加密正文。

